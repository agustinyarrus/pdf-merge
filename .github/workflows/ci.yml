# La CI de pdf-merge. Corre donde pdf-merge existe, en un Windows de verdad,
# con el Go que declara go.mod: la versión MÍNIMA (1.26.0, sin línea
# toolchain). Si pasa con esa, `go install …@latest` anda con cualquier 1.26.x.
#
# Qué se mira, en orden: formato, go.mod ordenado, vet (también para Linux:
# el lector y el escritor de PDF compilan fuera de Windows), todas las
# pruebas —con los PDF de prueba generados, así no se saltea ninguna—, que no
# dejen nada en el árbol, y el .exe tal como se publica, con su versión y su
# SHA256. Después, los oráculos: cada PDF combinado pasa por tres lectores
# independientes (qpdf, pypdf y PDFium) en los casos armados de fixtures,
# marcadores y enlaces, y cifrado.
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows · formato, vet, pruebas, build y oráculos
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      # El Go que instaló setup-go, y ningún otro (sin bajar toolchains).
      GOTOOLCHAIN: local
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Sin dependencias (no hay go.sum) no hay módulos que guardar, y
          # compilar en frío es parte de lo que se prueba.
          cache: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Python para los PDF de prueba y los oráculos
        run: |
          # Las versiones con que se verificó, fijadas; solo ruedas (nada que compilar).
          python -m pip install --no-input --only-binary=:all: -r internal/pdf/_oracle/requirements.txt

      - name: La máquina
        timeout-minutes: 2
        continue-on-error: true
        run: |
          go version
          python --version
          python -c "import pikepdf, pypdf, pypdfium2; print('qpdf', pikepdf.__libqpdf_version__, '· pypdf', pypdf.__version__, '· pypdfium2', pypdfium2.version.PYPDFIUM_INFO)"
          "Windows $([Environment]::OSVersion.Version)"
          $global:LASTEXITCODE = 0

      - name: Formato (gofmt)
        run: |
          $mal = @(gofmt -l .)
          if ($mal) {
            gofmt -d .
            foreach ($f in $mal) { "::error file=$($f -replace '\\', '/')::gofmt: sin formato (gofmt -w $f)" }
            exit 1
          }

      - name: go.mod ordenado
        run: go mod tidy -diff

      - name: go vet
        run: go vet ./...

      - name: go vet para Linux (el lector de PDF compila fuera de Windows)
        env:
          GOOS: linux
        run: go vet ./...

      - name: PDF de prueba
        run: ./scripts/fixtures.ps1 -Dir "$env:RUNNER_TEMP\pdf-fx"

      - name: Pruebas
        env:
          PDF_FIXTURES: ${{ runner.temp }}\pdf-fx
        run: ./.github/pruebas.ps1 -Informe "$env:RUNNER_TEMP\pruebas.json"

      - name: Guardar los eventos de las pruebas
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pruebas-${{ github.sha }}
          path: ${{ runner.temp }}/pruebas.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Las pruebas no dejaron nada en el árbol
        run: |
          $sucio = @(git status --porcelain)
          if ($sucio) { $sucio; '::error::las pruebas dejaron archivos en el repo'; exit 1 }

      - name: build.ps1
        run: |
          # Los acentos y las marcas de build.ps1, en UTF-8 (la consola del runner es OEM).
          try { [Console]::OutputEncoding = [Text.UTF8Encoding]::new($false) } catch { }
          ./build.ps1

      - name: El .exe dice su versión y su commit
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          try { [Console]::OutputEncoding = [Text.UTF8Encoding]::new($false) } catch { }
          $version = [regex]::Match((Get-Content internal/version/version.go -Raw), 'Version\s*=\s*"([^"]+)"').Groups[1].Value
          $quiere = "pdf-merge $version+$(git rev-parse --short=7 HEAD)"
          $dice = (./dist/pdf-merge.exe --version | Out-String).Trim()
          "pdf-merge --version: $dice"
          if ($dice -cne $quiere) { "::error::esperaba '$quiere'"; exit 1 }
          # En una etiqueta, la etiqueta y el código dicen la misma versión.
          if ($env:REF_TYPE -eq 'tag' -and $env:REF_NAME -cne "v$version") {
            "::error::la etiqueta $env:REF_NAME no es la versión del código (v$version)"
            exit 1
          }

      - name: Oráculos · qpdf, pypdf y PDFium
        run: |
          # all.ps1 compila su propio pdf-merge y corre las etapas con casos
          # armados; sin -Corpus no hay barrido de PDF reales (son documentos
          # privados y no viajan con el repo).
          try { [Console]::OutputEncoding = [Text.UTF8Encoding]::new($false) } catch { }
          ./internal/pdf/_oracle/all.ps1 -Fx "$env:RUNNER_TEMP\pdf-fx" -Work "$env:RUNNER_TEMP\pdf-oraculo"

      - name: SHA256SUMS
        run: |
          $h = (Get-FileHash -Algorithm SHA256 dist/pdf-merge.exe).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$PWD/dist/SHA256SUMS", "$h  pdf-merge.exe`n")
          Get-Content dist/SHA256SUMS

      - name: Guardar el .exe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pdf-merge-${{ github.sha }}
          path: |
            dist/pdf-merge.exe
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
